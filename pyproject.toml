[project]
name = "group-pilot"
version = "0.3.0"
description = "ScenePilot: MCP-powered multi-agent portrait photography location planner"
authors = [
    { name = "zynaicj", email = "1471492469@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.25",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
    "pydantic>=2.12,<3",
    "langchain-mcp-adapters>=0.3.2,<0.4",
]

[project.scripts]
group-pilot = "group_pilot.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
