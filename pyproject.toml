[project]
name = "scene-pilot"
version = "0.6.0"
description = "ScenePilot: MCP-powered multi-agent portrait photography location planner"
authors = [
    { name = "zynaicj", email = "1471492469@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.25",
    "langchain-openai>=1.7.2",
    "python-dotenv>=1.2.4",
    "pydantic>=2.12,<3",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "astral>=3.2,<4",
    "tzdata>=2025.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
scene-pilot-check-model = "scene_pilot.diagnostics:main"
scene-pilot = "scene_pilot.main:main"
scene-pilot-api = "scene_pilot.api.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
